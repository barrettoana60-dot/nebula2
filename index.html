<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nebula Research — Pesquisa acadêmica multimodal com análise inteligente, visual escuro animado e repositórios privados">
    <title>Nebula Research</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23e0e0e0' stroke-width='8' /><circle cx='50' cy='50' r='15' fill='%23e0e0e0' /></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="app" class="app-root">
        <!-- Floating orbs -->
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>

        <!-- Navbar (hidden when not logged in) -->
        <nav id="navbar" class="nav-shell" style="display:none">
            <div class="nav-brand">Nebula Research</div>
            <div class="nav-links" id="navLinks"></div>
            <div class="nav-right">
                <div class="nav-user-chip" id="navUserChip"></div>
                <button class="nav-logout-btn" id="navLogout" onclick="NebulaApp.logout()">Sair</button>
            </div>
        </nav>

        <!-- Page Container -->
        <main id="pageContainer" class="page-container"></main>
    </div>

    <!-- Scripts (v4 cache bust) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=13"></script>
    <script src="js/storage.js?v=13"></script>
    <script src="js/text-engine.js?v=13"></script>
    <script src="js/ai-engine.js?v=13"></script>
    <script src="js/document-engine.js?v=13"></script>
    <script src="js/search-engine.js?v=13"></script>
    <script src="js/network-engine.js?v=13"></script>
    <script src="js/pages/dashboard.js?v=13"></script>
    <script src="js/pages/search.js?v=13"></script>
    <script src="js/pages/repository.js?v=13"></script>
    <script src="js/pages/analysis.js?v=13"></script>
    <script src="js/pages/connections.js?v=13"></script>
    <script src="js/pages/chat.js?v=13"></script>
    <script src="js/pages/profile.js?v=13"></script>
    <script src="js/auth.js?v=13"></script>
    <script src="js/tutorial.js?v=13"></script>

</html>
